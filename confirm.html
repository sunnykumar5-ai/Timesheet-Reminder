<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timesheet Submission Confirmation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: #f4f6fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(31,56,100,.12);
            max-width: 460px;
            width: 100%;
            overflow: hidden;
        }
        .card-header {
            background: #1F3864;
            color: #fff;
            padding: 28px 32px;
            text-align: center;
        }
        .card-header h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .card-header p {
            font-size: 13px;
            opacity: .75;
            font-weight: 300;
        }
        .card-body {
            padding: 32px;
        }
        .field {
            margin-bottom: 20px;
        }
        .field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #1F3864;
            margin-bottom: 6px;
        }
        .field input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e4ea;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Outfit', sans-serif;
            transition: border-color .2s;
            outline: none;
        }
        .field input:focus {
            border-color: #1F3864;
            box-shadow: 0 0 0 3px rgba(31,56,100,.1);
        }
        .info-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .info-box {
            flex: 1;
            background: #f0f4fa;
            border-radius: 10px;
            padding: 12px 14px;
            text-align: center;
        }
        .info-box .lbl {
            font-size: 11px;
            color: #888;
            margin-bottom: 2px;
        }
        .info-box .val {
            font-size: 14px;
            font-weight: 600;
            color: #1F3864;
        }
        .ts-list {
            margin-bottom: 24px;
        }
        .ts-list .lbl {
            font-size: 13px;
            font-weight: 500;
            color: #1F3864;
            margin-bottom: 8px;
        }
        .ts-tag {
            display: inline-block;
            background: #D6E4F0;
            color: #1F3864;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin: 3px 4px 3px 0;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: all .2s;
        }
        .btn-submit {
            background: #375623;
            color: #fff;
        }
        .btn-submit:hover {
            background: #2a4419;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(55,86,35,.3);
        }
        .btn-submit:disabled {
            background: #aaa;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .status {
            margin-top: 20px;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            text-align: center;
            line-height: 1.5;
        }
        .status.success {
            display: block;
            background: #C6EFCE;
            color: #375623;
        }
        .status.warning {
            display: block;
            background: #FFF3CD;
            color: #856404;
        }
        .status.error {
            display: block;
            background: #FCE4D6;
            color: #9C0006;
        }
        .status.loading {
            display: block;
            background: #D6E4F0;
            color: #1F3864;
        }
        .footer {
            text-align: center;
            padding: 0 32px 24px;
            font-size: 11px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <h1>Timesheet Submission Confirmation</h1>
            <p>Confirm that you have submitted your timesheets</p>
        </div>
        <div class="card-body">
            <div class="field">
                <label for="assocId">Your Associate ID</label>
                <input type="text" id="assocId" placeholder="Enter your Associate ID (e.g. 2383028)" autofocus>
            </div>
            <div class="info-row">
                <div class="info-box">
                    <div class="lbl">Week Ending</div>
                    <div class="val" id="weekFriday">--</div>
                </div>
                <div class="info-box">
                    <div class="lbl">Sheet</div>
                    <div class="val" id="sheetName">--</div>
                </div>
            </div>
            <div class="ts-list">
                <div class="lbl">Timesheet types to be marked as Submitted:</div>
                <div id="tsTypes"></div>
            </div>
            <button class="btn btn-submit" id="submitBtn" onclick="submitConfirmation()">
                Yes - I have submitted
            </button>
            <div class="status" id="statusMsg"></div>
        </div>
        <div class="footer">Timesheet Reminder Agent</div>
    </div>

    <script>
        var params = new URLSearchParams(window.location.search);
        var weekFriday = params.get('week_friday') || '';
        var sheetName = params.get('sheet_name') || '';
        var flow2Base = params.get('flow2_base') || '';
        var flow2Params = params.get('flow2_params') || '';
        var timesheetTypes = (params.get('timesheet_types') || 'FG Timesheet,Cognizant Timesheet,PPMO Timesheet').split(',');

        if (weekFriday) {
            try {
                var d = new Date(weekFriday + 'T00:00:00');
                var options = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
                document.getElementById('weekFriday').textContent = d.toLocaleDateString('en-GB', options);
            } catch(e) {
                document.getElementById('weekFriday').textContent = weekFriday;
            }
        }
        document.getElementById('sheetName').textContent = sheetName || '--';

        var tsContainer = document.getElementById('tsTypes');
        timesheetTypes.forEach(function(t) {
            t = t.trim();
            if (t) {
                var span = document.createElement('span');
                span.className = 'ts-tag';
                span.textContent = t;
                tsContainer.appendChild(span);
            }
        });

        function showStatus(msg, type) {
            var el = document.getElementById('statusMsg');
            el.className = 'status ' + type;
            el.innerHTML = msg;
        }

        function submitConfirmation() {
            var assocId = document.getElementById('assocId').value.trim();
            if (!assocId) {
                showStatus('Please enter your Associate ID.', 'error');
                return;
            }
            if (!/^\d+$/.test(assocId)) {
                showStatus('Associate ID should contain only numbers.', 'error');
                return;
            }
            if (!flow2Base) {
                showStatus('Flow URL not configured. Please contact your admin.', 'error');
                return;
            }

            var btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Submitting...';
            showStatus('Updating timesheet status for ID: ' + assocId + '...', 'loading');

            var flow2Url = flow2Base + '?' + flow2Params;

            var payload = {
                associateId: assocId,
                weekFriday: weekFriday,
                sheetName: sheetName,
                timesheetTypes: timesheetTypes.join(',')
            };

            fetch(flow2Url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(function(response) {
                return response.text().then(function(text) {
                    var data = null;
                    try {
                        data = JSON.parse(text);
                    } catch(e) {
                        // Response is not JSON
                    }

                    if (response.ok || response.status === 202) {
                        // 200 OK — check if actually updated or already submitted
                        if (data && data.updated === false) {
                            // Already submitted
                            showStatus('&#9888; Timesheet status already updated for Associate ID: <b>' + assocId + '</b>.<br>No changes needed. You can close this page.', 'warning');
                            btn.textContent = 'Already Submitted';
                            btn.style.background = '#856404';
                        } else if (data && data.message) {
                            // Successfully updated
                            showStatus('&#10004; ' + data.message, 'success');
                            btn.textContent = 'Submitted!';
                            btn.style.background = '#375623';
                        } else {
                            // Generic success (no JSON or old format)
                            showStatus('&#10004; Timesheet status updated to <b>Submitted</b> for Associate ID: <b>' + assocId + '</b>.<br>You can close this page.', 'success');
                            btn.textContent = 'Submitted!';
                            btn.style.background = '#375623';
                        }
                    } else if (response.status === 400) {
                        // Invalid Associate ID or not found
                        var errMsg = 'Invalid Associate ID: <b>' + assocId + '</b>. Not found in the tracker sheet.<br>Please check your ID and try again.';
                        if (data && data.message) {
                            if (data.message.toLowerCase().indexOf('not found') !== -1) {
                                errMsg = 'Associate ID <b>' + assocId + '</b> was not found in sheet <b>' + sheetName + '</b>.<br>Please check your ID and try again.';
                            } else {
                                errMsg = data.message;
                            }
                        }
                        showStatus('&#10060; ' + errMsg, 'error');
                        btn.disabled = false;
                        btn.textContent = 'Yes - I have submitted';
                    } else {
                        throw new Error('Status ' + response.status);
                    }
                });
            })
            .catch(function(err) {
                btn.disabled = false;
                btn.textContent = 'Yes - I have submitted';
                showStatus('&#10060; Could not reach the server. Please try again or contact your admin.', 'error');
            });
        }

        document.getElementById('assocId').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitConfirmation();
            }
        });
    </script>
</body>
</html>
