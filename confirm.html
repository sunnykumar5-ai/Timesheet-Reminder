<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timesheet Confirmation</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    background: #f4f6fa;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.10);
    padding: 36px 32px;
    max-width: 440px;
    width: 100%;
  }
  .logo {
    background: #1F3864;
    color: #fff;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 15px;
    font-weight: bold;
    display: inline-block;
    margin-bottom: 24px;
  }
  h2 { font-size: 18px; color: #1F3864; margin-bottom: 6px; }
  .subtitle { font-size: 13px; color: #888; margin-bottom: 24px; }
  .loading-box {
    background: #f0f4ff;
    border-left: 4px solid #1F3864;
    border-radius: 4px;
    padding: 12px 14px;
    font-size: 13px;
    color: #555;
    margin-bottom: 24px;
  }
  .info-box {
    background: #f0f4ff;
    border-left: 4px solid #1F3864;
    border-radius: 4px;
    padding: 14px;
    font-size: 13px;
    color: #333;
    margin-bottom: 24px;
    display: none;
  }
  .info-box .name-tag {
    font-size: 17px;
    font-weight: bold;
    color: #1F3864;
    margin-bottom: 4px;
  }
  .info-box .id-tag {
    font-size: 12px;
    color: #666;
    margin-bottom: 6px;
  }
  .info-box .types-tag {
    font-size: 12px;
    color: #444;
  }
  .not-found {
    background: #FCE4D6;
    color: #9C0006;
    border-left: 4px solid #9C0006;
    border-radius: 4px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 20px;
    display: none;
  }
  .fallback-box {
    display: none;
    margin-bottom: 20px;
  }
  .fallback-box label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    color: #444;
    margin-bottom: 6px;
  }
  .input-row {
    display: flex;
    gap: 8px;
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    color: #333;
    background: #fafafa;
  }
  input[type="text"]:focus { outline: none; border-color: #1F3864; }
  .btn-lookup {
    padding: 10px 16px;
    background: #1F3864;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-lookup:hover { background: #162d4e; }
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-confirm { background: #1F7A3A; color: #fff; }
  .btn-confirm:hover { background: #165c2b; }
  .btn-confirm:disabled { background: #aaa; cursor: not-allowed; }
  .status {
    margin-top: 18px;
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 14px;
    display: none;
  }
  .status.success { background: #C6EFCE; color: #375623; display: block; }
  .status.error   { background: #FCE4D6; color: #9C0006; display: block; }
  .status.loading { background: #FFF3CD; color: #856404; display: block; }
  .week-info {
    font-size: 12px;
    color: #aaa;
    margin-top: 18px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Cognizant Timesheet</div>
  <h2>Confirm Submission</h2>
  <p class="subtitle">Week ending <span id="week-date">...</span></p>

  <div class="loading-box" id="loading-box">
    Identifying you from your Cognizant account...
  </div>

  <div class="info-box" id="info-box">
    <div class="name-tag" id="confirm-name"></div>
    <div class="id-tag">Associate ID: <span id="confirm-id"></span></div>
    <div class="types-tag">Pending: <span id="confirm-types"></span></div>
  </div>

  <div class="not-found" id="not-found"></div>

  <div class="fallback-box" id="fallback-box">
    <label>Enter your Associate ID manually</label>
    <div class="input-row">
      <input type="text" id="assoc-input" placeholder="e.g. 2383028"
             maxlength="20" onkeydown="handleKey(event)"/>
      <button class="btn-lookup" onclick="manualLookup()">Look up</button>
    </div>
  </div>

  <button class="btn btn-confirm" id="confirm-btn"
          disabled onclick="confirmSubmission()">
    Confirm - Yes I have submitted
  </button>

  <div class="status" id="status-msg"></div>
  <div class="week-info" id="week-info"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/msal.js/2.38.3/msal-browser.min.js"></script>
<script>
  var flow2Base      = "";
  var flow2Fixed     = "";
  var weekFriday     = "";
  var sheetName      = "";
  var members        = [];
  var selectedMember = null;

  // ── MSAL config ─────────────────────────────────────────────
  // Uses Cognizant's Azure AD tenant
  var msalConfig = {
    auth: {
      clientId   : "04b07795-8ddb-461a-bbee-02f9e1bf7b46", // Azure CLI public client
      authority  : "https://login.microsoftonline.com/common",
      redirectUri: window.location.href.split("?")[0],
    },
    cache: { cacheLocation: "sessionStorage" },
  };
  var msalInstance = new msal.PublicClientApplication(msalConfig);

  function getParams() {
    var result = {};
    var qs = window.location.search.substring(1);
    qs = qs.replace(/&amp;/g, "&");
    qs.split("&").forEach(function(part) {
      var eq = part.indexOf("=");
      if (eq > -1) {
        var key = decodeURIComponent(part.substring(0, eq).replace(/\+/g, " "));
        var val = decodeURIComponent(part.substring(eq + 1).replace(/\+/g, " "));
        result[key] = val;
      }
    });
    return result;
  }

  function init() {
    var params = getParams();
    weekFriday = params["week_friday"]  || "";
    sheetName  = params["sheet_name"]   || "";
    flow2Base  = params["flow2_base"]   || "";
    flow2Fixed = params["flow2_params"] || "";
    var membersRaw = params["members"]  || "";

    if (weekFriday) {
      document.getElementById("week-date").textContent = weekFriday;
      document.getElementById("week-info").textContent =
        "Week: " + weekFriday + "  |  Sheet: " + sheetName;
    }

    members = [];
    if (membersRaw) {
      membersRaw.split("~~").forEach(function(entry) {
        var parts = entry.split("|");
        if (parts.length >= 3) {
          members.push({
            id   : parts[0].trim(),
            name : parts[1].trim(),
            types: parts[2].trim(),
          });
        }
      });
    }

    // Try to get logged in user automatically
    autoIdentify();
  }

  async function autoIdentify() {
    try {
      await msalInstance.initialize();

      // Handle redirect response first
      await msalInstance.handleRedirectPromise();

      var accounts = msalInstance.getAllAccounts();
      var loginHint = accounts.length > 0 ? accounts[0].username : null;

      var tokenRequest = {
        scopes    : ["User.Read"],
        loginHint : loginHint,
      };

      var tokenResponse;
      try {
        // Try silent first
        tokenResponse = await msalInstance.acquireTokenSilent({
          ...tokenRequest,
          account: accounts[0],
        });
      } catch (silentErr) {
        // Silent failed — try popup
        try {
          tokenResponse = await msalInstance.acquireTokenPopup(tokenRequest);
        } catch (popupErr) {
          // Popup blocked or failed — show manual fallback
          showFallback("Could not auto-identify. Please enter your Associate ID.");
          return;
        }
      }

      // Got token — call Graph API to get user details
      var graphResponse = await fetch("https://graph.microsoft.com/v1.0/me", {
        headers: { Authorization: "Bearer " + tokenResponse.accessToken }
      });
      var user = await graphResponse.json();

      // Extract associate ID from email (part before @)
      var email    = user.userPrincipalName || user.mail || "";
      var assocId  = email.split("@")[0].trim();
      var fullName = user.displayName || assocId;

      document.getElementById("loading-box").style.display = "none";

      // Match against pending members list
      var found = null;
      for (var i = 0; i < members.length; i++) {
        if (members[i].id.toLowerCase() === assocId.toLowerCase()) {
          found = members[i];
          break;
        }
      }

      if (found) {
        selectedMember = found;
        showMember(found);
      } else {
        // Person is not in pending list
        var notFound = document.getElementById("not-found");
        notFound.style.display = "block";
        notFound.textContent   =
          "Hi " + fullName + " (" + assocId + ") — your timesheet "
          + "is not in the pending list. It may already be marked as "
          + "submitted, or contact your manager.";
        document.getElementById("confirm-btn").disabled = true;
      }

    } catch (err) {
      showFallback("Auto-identification failed. Please enter your Associate ID.");
    }
  }

  function showMember(m) {
    document.getElementById("confirm-name").textContent  = m.name;
    document.getElementById("confirm-id").textContent    = m.id;
    document.getElementById("confirm-types").textContent =
      m.types.replace(/,/g, ", ");
    document.getElementById("info-box").style.display    = "block";
    document.getElementById("confirm-btn").disabled      = false;
  }

  function showFallback(msg) {
    document.getElementById("loading-box").style.display  = "none";
    document.getElementById("not-found").style.display    = "block";
    document.getElementById("not-found").textContent      = msg;
    document.getElementById("fallback-box").style.display = "block";
  }

  function handleKey(e) {
    if (e.key === "Enter") manualLookup();
  }

  function manualLookup() {
    var input = document.getElementById("assoc-input").value.trim();
    if (!input) return;

    var found = null;
    for (var i = 0; i < members.length; i++) {
      if (members[i].id.toLowerCase() === input.toLowerCase()) {
        found = members[i];
        break;
      }
    }

    document.getElementById("not-found").style.display = "none";

    if (found) {
      selectedMember = found;
      document.getElementById("fallback-box").style.display = "none";
      showMember(found);
    } else {
      selectedMember = null;
      var notFound = document.getElementById("not-found");
      notFound.style.display = "block";
      notFound.textContent   =
        "Associate ID " + input + " not found in pending list. "
        + "Check your ID or contact your manager.";
      document.getElementById("confirm-btn").disabled = true;
    }
  }

  function confirmSubmission() {
    if (!selectedMember) return;

    var statusDiv = document.getElementById("status-msg");
    var btn       = document.getElementById("confirm-btn");

    if (!flow2Base || !flow2Fixed || !weekFriday || !sheetName) {
      statusDiv.className   = "status error";
      statusDiv.textContent =
        "Configuration error - missing parameters. Contact your admin.";
      return;
    }

    btn.disabled          = true;
    btn.textContent       = "Submitting...";
    statusDiv.className   = "status loading";
    statusDiv.textContent =
      "Updating tracker for " + selectedMember.name + "...";

    var perPerson =
        "associate_id="     + encodeURIComponent(selectedMember.id)
      + "&week_friday="     + encodeURIComponent(weekFriday)
      + "&timesheet_types=" + encodeURIComponent(selectedMember.types)
      + "&sheet_name="      + encodeURIComponent(sheetName);

    var url = flow2Base + "?" + flow2Fixed + "&" + perPerson;

    fetch(url, { method: "GET" })
      .then(function(r) {
        if (r.ok || r.status === 200 || r.status === 202) {
          statusDiv.className   = "status success";
          statusDiv.textContent =
            "Thank you " + selectedMember.name
            + "! Your timesheet status has been updated to Submitted.";
          btn.textContent = "Confirmed";
          document.getElementById("assoc-input") &&
            (document.getElementById("assoc-input").disabled = true);
        } else {
          throw new Error("HTTP " + r.status);
        }
      })
      .catch(function(err) {
        statusDiv.className   = "status error";
        statusDiv.textContent =
          "Update failed (" + err.message
          + "). Please update the tracker manually or contact your admin.";
        btn.disabled    = false;
        btn.textContent = "Confirm - Yes I have submitted";
      });
  }

  init();
</script>
</body>
</html>
